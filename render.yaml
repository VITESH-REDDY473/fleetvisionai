services:
  # 1. Backend REST API & Real-time WebSocket Telematics Gateway
  - type: web
    name: fleetvisionai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free

  # 2. Frontend Next.js Operations Command Center
  - type: web
    name: fleetvisionai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
